---
- name: Deploy WAR to Tomcat
  hosts: all
  become: yes
  vars:
    tomcat_home: "/opt/tomcat"
    tomcat_user: "tomcat"
  
  tasks:
    - name: Stop Tomcat
      shell: "{{ tomcat_home }}/bin/shutdown.sh"
      args:
        executable: /bin/bash
      ignore_errors: yes

    - name: Wait for Tomcat to stop
      wait_for:
        port: 8080
        state: stopped
        timeout: 30
      ignore_errors: yes

    - name: Kill any remaining Tomcat processes
      shell: "pkill -9 -f tomcat"
      ignore_errors: yes

    - name: Remove old deployment
      shell: rm -rf {{ tomcat_home }}/webapps/sample-java-webapp*
      ignore_errors: yes

    - name: Download WAR from Nexus
      get_url:
        url: "http://172.31.47.6:8081/repository/maven-releases/com/demo/sample-java-webapp/1.0.0/sample-java-webapp-1.0.0.war"
        dest: "{{ tomcat_home }}/webapps/sample-java-webapp.war"
        url_username: admin
        url_password: admin123
        owner: "{{ tomcat_user }}"
        group: "{{ tomcat_user }}"
        mode: '0644'
        force: yes

    - name: Start Tomcat
      shell: "nohup {{ tomcat_home }}/bin/startup.sh &"
      args:
        executable: /bin/bash
      become_user: "{{ tomcat_user }}"

    - name: Wait for Tomcat to start
      wait_for:
        port: 8080
        delay: 10
        timeout: 60

    - name: Check if application is deployed
      uri:
        url: "http://localhost:8080/sample-java-webapp"
        status_code: 200,404
      register: result
      retries: 5
      delay: 5
      ignore_errors: yes

    - name: Display result
      debug:
        msg: "Application URL: http://172.31.33.205:8080/sample-java-webapp"
